<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mercatus Launch Studio</title>
  <desc id="desc">Architecture image for launch packages, pricing, onboarding, and go-live gates.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfcf7"/><stop offset="1" stop-color="#eef6f8"/></linearGradient><style>.title{font:700 42px Arial,sans-serif;fill:#18232d}.sub{font:500 18px Arial,sans-serif;fill:#5b6874}.card{fill:#fff;stroke:#d9e2df;stroke-width:1.5;rx:18}.core{fill:#183241;rx:24}.coreText{font:800 26px Arial,sans-serif;fill:#fff}.coreSub{font:500 14px Arial,sans-serif;fill:#d5e6eb}.label{font:700 18px Arial,sans-serif;fill:#18232d}.body{font:500 14px Arial,sans-serif;fill:#5b6874}.line{stroke:#3d7d77;stroke-width:2.5;fill:none;stroke-linecap:round}.step{fill:#edf8f3;stroke:#bfddd2;rx:16}</style></defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="70" y="78" class="title">Mercatus Launch Studio</text>
  <text x="72" y="112" class="sub">Turn product manifests into launch packages, pricing, onboarding, and go-live proof.</text>
  <rect x="420" y="250" width="360" height="180" class="core"/>
  <text x="600" y="314" text-anchor="middle" class="coreText">Launch Package Engine</text>
  <text x="600" y="346" text-anchor="middle" class="coreSub">positioning • pricing • onboarding • go-live</text>
  <rect x="70" y="170" width="310" height="112" class="card"/><text x="105" y="216" class="label">Product Manifest</text><text x="105" y="246" class="body">Offer, audience, proof, launch target</text>
  <rect x="70" y="450" width="310" height="112" class="card"/><text x="105" y="496" class="label">Pricing Advisor</text><text x="105" y="526" class="body">value, complexity, proof, support</text>
  <rect x="820" y="170" width="310" height="112" class="card"/><text x="855" y="216" class="label">Six-Step Onboarding</text><text x="855" y="246" class="body">Brand, Content, Features, Updates, Go Live</text>
  <rect x="820" y="450" width="310" height="112" class="card"/><text x="855" y="496" class="label">Go-Live Gate</text><text x="855" y="526" class="body">claim check, support loop, proof</text>
  <path d="M380 226 C430 240 430 304 420 328" class="line"/><path d="M380 506 C430 482 430 398 420 362" class="line"/><path d="M820 226 C770 240 770 304 780 328" class="line"/><path d="M820 506 C770 482 770 398 780 362" class="line"/>
  <rect x="230" y="632" width="740" height="38" class="step"/><text x="600" y="656" text-anchor="middle" font="700 14px Arial" fill="#4e665f">Launch packages are not copy. They are claim-checked operating plans.</text>
</svg>
