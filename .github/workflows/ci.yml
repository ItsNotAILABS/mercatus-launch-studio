name: Mercatus Launch Studio CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate launch templates
        run: python tools/mercatusctl.py validate
      - name: Run smoke tests
        run: python tests/smoke_test.py
      - name: Run launch package benchmark
        run: python benchmarks/benchmark_launch_packages.py
